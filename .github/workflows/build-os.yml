name: Build bootable OS preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lockscreen/**"
      - "os-image/**"
      - ".github/workflows/build-os.yml"
      - "index.html"
      - "styles.css"
      - "src/**"

permissions:
  contents: read

jobs:
  build-live-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Prepare desktop files for the image
        run: |
          mkdir -p os-image/config/includes.chroot/opt/windows-remake
          cp -a lockscreen index.html styles.css src os-image/config/includes.chroot/opt/windows-remake/

      - name: Build Debian Live ISO in a Debian container
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/os-image \
            debian:bookworm bash -lc '
              set -eux
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso isolinux syslinux-common \
                grub-pc-bin grub-efi-amd64-bin dosfstools mtools
              chmod +x config/hooks/normal/0100-copy-user-data.hook.chroot
              lb config noauto \
                --distribution bookworm \
                --architectures amd64 \
                --binary-images iso-hybrid \
                --mirror-bootstrap http://deb.debian.org/debian \
                --mirror-chroot http://deb.debian.org/debian \
                --mirror-binary http://deb.debian.org/debian \
                --archive-areas "main contrib non-free-firmware" \
                --debian-installer none \
                --bootappend-live "boot=live components username=user hostname=windows-remake" \
                --apt-recommends true \
                --memtest none
              lb build
            '

      - name: Rename ISO
        run: |
          ISO="$(find os-image -maxdepth 1 -type f -name '*.hybrid.iso' -print -quit)"
          test -n "$ISO"
          cp "$ISO" Windows-Remake-OS-preview-amd64.iso
          sha256sum Windows-Remake-OS-preview-amd64.iso > Windows-Remake-OS-preview-amd64.iso.sha256

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: windows-remake-os-preview
          path: |
            Windows-Remake-OS-preview-amd64.iso
            Windows-Remake-OS-preview-amd64.iso.sha256
          retention-days: 14
