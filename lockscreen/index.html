<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#075ca8">
  <title>Welcome — Windows Remake OS</title>
  <link rel="stylesheet" href="lockscreen.css">
</head>
<body>
  <main class="lock" id="lock">
    <div class="ambient" aria-hidden="true"></div>
    <div class="topline"><span class="system-mark"><i></i><i></i><i></i><i></i></span><span>WINDOWS REMAKE OS</span></div>
    <section class="welcome" aria-label="Welcome">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">Loading date…</div>
      <p class="hint" id="hint">Welcome back</p>
      <button class="enter" id="enter" type="button" aria-label="Enter desktop">
        <span class="button-mark"><i></i><i></i><i></i><i></i></span>
      </button>
      <div class="enter-label">CLICK THE WINDOWS LOGO TO ENTER</div>
      <p class="help">Your desktop is ready</p>
    </section>
    <footer><span>◉ &nbsp; Local session</span><span>Windows Remake · Preview</span></footer>
  </main>
  <script src="lockscreen.js"></script>
</body>
</html>
